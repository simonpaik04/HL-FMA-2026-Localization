# 용인 RDDF 1_right, index=0의 path_yaw_rad. ENU: 동쪽 0, 반시계 양수.
# 차량을 이 출발 방향에 놓고 실행한다. 자동 현재 위치/도로 선택은 하지 않는다.
# 시작 경로를 바꾸면 RDDF 원본의 해당 yaw와 source를 함께 갱신한다.
initial_heading:
  yaw_rad: &start_yaw 2.8181825146
  standard_deviation_deg: 10.0
  # 배치 방향의 잠정 불확실성이다. 측량 정확도가 아니다.
  source: rddf/yongin_1_right.csv#index=0

# 같은 yaw를 두 EKF에도 먼저 설정한다. 엔코더가 IMU보다 먼저 와도 yaw=0으로 시작하지 않는다.
# x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
initial_state: [0, 0, 0, 0, 0, *start_yaw, 0, 0, 0, 0, 0, 0, 0, 0, 0]
