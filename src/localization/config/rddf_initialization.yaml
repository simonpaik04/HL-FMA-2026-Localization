# RDDF 원본 origin과 같은 지리 기준. 측량 완료 플래그를 만들지 않는다.
reference:
  mode: rddf_datum
  measured: false
  measured_at: ""
  source: rddf/yongin_route_project.json#origin
  latitude_deg: 37.288731
  longitude_deg: 127.1072336
  altitude_m: 0.0
  yaw_offset_rad: 0.0
  map_x_m: 0.0
  map_y_m: 0.0
  map_z_m: 0.0
initialization:
  rddf_directory: rddf
  max_snap_distance_m: 5.0
  ambiguity_distance_m: 0.5
  gps_consecutive_samples: 3
  gps_cluster_radius_m: 1.5
  max_candidate_age_sec: 1.0
  max_future_sec: 0.50
  max_speed_mps: 0.30
  speed_timeout_sec: 0.20
  clock_timeout_sec: 3.0
  confirmation_timeout_sec: 3.0  # 지연 안내 기준. 초과해도 확인을 계속 기다린다.
  confirmation_distance_m: 1.0
  confirmation_yaw_deg: 5.0
  confirmation_samples: 3
  position_variance_m2: 1.0
  heading_standard_deviation_deg: 10.0
  service_wait_sec: 0.30
