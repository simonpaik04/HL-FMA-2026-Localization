# 실 IMU + 가상 엔코더 테스트의 수동 출발 조건.
# rddf/yongin_1_right.csv index=0의 east_m, north_m, path_yaw_rad와 동일하다.
# GPS 측정값이 아니다. 시작 시 실 IMU 방향을 이 RDDF 진행 방향으로 정렬한다.
initial_heading:
  yaw_rad: &start_yaw 2.8181825146
  standard_deviation_deg: 10.0
  source: keyboard_test:rddf/yongin_1_right.csv#index=0

# x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
# Local과 Global에 같은 좌표/방향을 주므로 시작 시 map -> odom은 항등이다.
initial_state: [37.006811, 26.908526, 0, 0, 0, *start_yaw, 0, 0, 0, 0, 0, 0, 0, 0, 0]
